<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    /* ================================
       ESTILO GENERAL - MOVEUP
       ================================ */

    body {
      font-family: system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, #0b0b0f, #15152b);
      color: #ffffff;
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    /* ================================
       TITULO
       ================================ */

    h1 {
      color: #ffffff;
      margin-bottom: 8px;
      font-size: 2.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }

    /* ================================
       SLOGAN
       ================================ */

    .slogan {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 25px;

      background: linear-gradient(90deg, #00e5ff, #7b2cff, #ff0080);
      color: white;

      padding: 12px 25px;
      border-radius: 30px;
      display: inline-block;

      box-shadow: 0 5px 20px rgba(123, 44, 255, 0.4);
      letter-spacing: 1px;
    }

    /* ================================
       BENEFICIOS
       ================================ */

    .beneficios {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      flex-wrap: wrap;

      background: linear-gradient(90deg, #111111, #202040, #111111);
      color: white;

      padding: 18px;
      margin-bottom: 35px;

      border-top: 2px solid #00e5ff;
      border-bottom: 2px solid #ff0080;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
    }

    .beneficios span {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ================================
       CATALOGO
       ================================ */

    #productos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 22px;
    }

    /* ================================
       TARJETAS DE PRODUCTOS
       ================================ */

    .producto {
      background: linear-gradient(145deg, #ffffff, #eeeeff);
      color: #171717;

      border: 2px solid transparent;
      border-radius: 15px;

      padding: 12px;
      width: 220px;

      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);

      transition: transform 0.3s ease,
                  box-shadow 0.3s ease,
                  border 0.3s ease;
    }

    .producto:hover {
      transform: translateY(-8px) scale(1.02);

      border: 2px solid #00e5ff;

      box-shadow:
        0 10px 30px rgba(0, 229, 255, 0.3),
        0 0 15px rgba(255, 0, 128, 0.2);
    }

    /* ================================
       IMAGENES
       ================================ */

    .producto img {
      width: 100%;
      height: 160px;

      object-fit: cover;

      border-radius: 10px;

      transition: transform 0.3s ease;
    }

    .producto:hover img {
      transform: scale(1.04);
    }

    /* ================================
       NOMBRE PRODUCTO
       ================================ */

    .producto h3 {
      margin-bottom: 8px;
      color: #15152b;
      font-size: 18px;
      font-weight: 800;
    }

    /* ================================
       DESCRIPCION
       ================================ */

    .descripcion {
      font-size: 14px;
      color: #555;
      min-height: 42px;
    }

    /* ================================
       PRECIO
       ================================ */

    .precio {
      font-size: 20px;
      font-weight: 900;

      background: linear-gradient(90deg, #ff0080, #7b2cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ================================
       BOTONES PRODUCTOS
       ================================ */

    .producto button {
      background: linear-gradient(90deg, #00c853, #00e676);

      border: none;
      color: white;

      padding: 10px 15px;
      margin-top: 7px;

      border-radius: 25px;

      cursor: pointer;

      font-weight: 700;

      box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);

      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .producto button:hover {
      transform: scale(1.05);

      box-shadow:
        0 5px 18px rgba(0, 230, 118, 0.5);
    }

    /* ================================
       CARRITO
       ================================ */

    .carrito {
      margin-top: 40px;

      padding: 25px;

      background: linear-gradient(145deg, #ffffff, #eeeeff);

      color: #222;

      border-radius: 15px;

      text-align: left;

      display: inline-block;

      min-width: 320px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4);

      border-top: 4px solid #00e5ff;
    }

    .carrito h2 {
      margin-top: 0;

      color: #15152b;

      font-size: 22px;
    }

    /* ================================
       LISTA CARRITO
       ================================ */

    #lista-carrito {
      padding-left: 20px;
    }

    #lista-carrito li {
      margin-bottom: 8px;
      font-weight: 500;
    }

    /* ================================
       RESUMEN
       ================================ */

    .resumen {
      border-top: 2px solid #ddd;

      margin-top: 15px;

      padding-top: 10px;
    }

    .total {
      font-size: 20px;
      font-weight: 900;

      color: #7b2cff;
    }

    /* ================================
       BOTON VACIAR
       ================================ */

    .vaciar {
      background: linear-gradient(90deg, #ff1744, #ff0055);

      border: none;

      color: white;

      padding: 10px 15px;

      margin-top: 10px;

      border-radius: 25px;

      cursor: pointer;

      font-weight: 700;

      transition: transform 0.2s ease;
    }

    /* ================================
       BOTON FINALIZAR
       ================================ */

    .finalizar {
      background: linear-gradient(90deg, #00b0ff, #2979ff);

      border: none;

      color: white;

      padding: 10px 15px;

      margin-top: 10px;

      margin-left: 5px;

      border-radius: 25px;

      cursor: pointer;

      font-weight: 700;

      box-shadow: 0 4px 12px rgba(41, 121, 255, 0.35);

      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    /* ================================
       EFECTOS BOTONES
       ================================ */

    .vaciar:hover,
    .finalizar:hover {
      transform: translateY(-2px);

      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>⚡ MoveUp | Moda Deportiva 🏆</h1>

  <p class="slogan">
    Viste tu movimiento, vive tu estilo 🔥
  </p>
  </p>

  <div class="beneficios">
    <span>🚚 Envíos en Bogotá</span>
    <span>🔒 Compra segura</span>
    <span>📦 Seguimiento de pedido</span>
  </div>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
      <p>
        Envío: <strong>Gratis</strong>
      </p>

      <p class="total">
        Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Conjunto deportivo mujer",
        descripcion: "✨ Comodidad, estilo y actitud en un solo conjunto. 💪💕",
        precio: 25000,
        imagen: "https://boldandgrit.com.co/cdn/shop/files/shorts_deportivos_para_mujer_1600x.jpg?v=1757006765"
      },
      {
        id: 2,
        nombre: "Conjunto deportivo caballero",
        descripcion: "💪 Estilo y comodidad para cada entrenamiento. 🔥",
        precio: 18000,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfnlQ279XtDgRLlBUq99NuYFf4hRrn5qF5ymtnFnAd32bNF-ScCAi-u1-H&s=10"
      },
      {
        id: 3,
        nombre: "Zapatos Deportivos mujer",
        descripcion: "👟 Comodidad que te acompaña en cada paso. 🔥",
        precio: 30000,
        imagen: "https://golty.com.co/wp-content/uploads/2025/09/tenis-deportivos-golty-lite-run-azul-gris-1.webp"
      },
      {
        id: 4,
        nombre: "Zapatos deportivos hombre",
        descripcion: "👟 Estilo, comodidad y actitud en cada paso. 💪🔥",
        precio: 18000,
        imagen: "https://cdn.baguer.co/uploads/2025/12/-blanco-837240BL_C.webp_s6TnSrFeTh52vLynn6H7va2QsST7bp.webp"
      },
      {
        id: 5,
        nombre: "Conjunto deportivo niños",
        descripcion: "🏃‍♂️✨ ¡Comodidad y estilo para pequeños que nunca paran! 💙",
        precio: 22000,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSczaQtRxWgQDHQb8LFUCbkYCgh1cmTZL6pWtbQVJI7PQ&s=10"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
